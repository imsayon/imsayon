name: Generate sage contribution snake

on:
  push:
    branches:
      - preview/sage-terminal-snake
      - main
    paths:
      - .github/workflows/profile-snake.yml
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: profile-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Check authenticated contribution token
        id: auth
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add PROFILE_STATS_TOKEN for authenticated snake regeneration."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate real contribution calendar snake
        if: steps.auth.outputs.ready == 'true'
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: imsayon
          github_token: ${{ secrets.PROFILE_STATS_TOKEN }}
          outputs: |
            assets/snake-sage-dark.svg?palette=github-dark&color_snake=%2339d353
            assets/snake-sage-light.svg?palette=github-light&color_snake=%232ea043

      - name: Commit generated SVGs
        if: steps.auth.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-sage-dark.svg assets/snake-sage-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh real GitHub contribution snake"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
