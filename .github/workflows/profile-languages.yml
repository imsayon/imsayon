name: Render public repository language breakdown

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"
  push:
    branches: [main]
    paths:
      - scripts/profile_languages.py
      - scripts/test_profile_languages.py
      - assets/templates/languages-compact.svg
      - .github/workflows/profile-languages.yml

permissions:
  contents: write

concurrency:
  group: profile-languages
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify aggregation and SVG rendering
        run: python -m unittest discover -s scripts -p 'test_profile_languages.py' -v
      - name: Fetch public language bytes and render SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_languages.py
      - name: Commit verified language chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/languages-by-size.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub language-by-size chart'
            git push origin HEAD:main
          fi
