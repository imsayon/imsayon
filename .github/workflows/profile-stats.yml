name: Verify and render profile contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * *"
  push:
    branches: [main]
    paths:
      - scripts/profile_stats.py
      - scripts/test_profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline validation
        run: python -m unittest discover -s scripts -p 'test_profile_stats.py' -v
      - name: Check private statistics credential
        id: credential
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add repository Actions secret PROFILE_STATS_TOKEN with read:user, then rerun this workflow. No stats will be fabricated."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate authoritative contribution SVG
        if: steps.credential.outputs.ready == 'true'
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/profile_stats.py
      - name: Commit verified stats
        if: steps.credential.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/engineering-dashboard.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update GitHub contribution dashboard from verified data'
            git push origin HEAD:main
          fi
