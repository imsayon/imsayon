<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Sayon — systems engineer terminal introduction</title>
<desc id="desc">Animated terminal-style introduction in charcoal and sage. Contains genuine project interests and profile links.</desc>
<defs>
  <radialGradient id="back"><stop stop-color="#1f4237"/><stop offset="1" stop-color="#0b1211"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#335548" stroke-width=".6" fill="none" opacity=".20"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8cdab6"/><stop offset="1" stop-color="#d1f0de"/></linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#829a90}
  .body{fill:#cfe0d6}
  .sage{fill:#94d8b7}
  .appears{animation:appear 12s both infinite}
  .one{animation-delay:0s}.two{animation-delay:.35s}.three{animation-delay:.75s}.four{animation-delay:1.15s}
  @keyframes appear{0%,4%{opacity:0;transform:translateY(5px)}12%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
  .cursor{animation:blink 1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.appears,.cursor{animation:none;opacity:1}}
</style>
<rect width="1200" height="440" fill="url(#back)"/>
<rect width="1200" height="440" fill="url(#grid)"/>
<rect x="52" y="31" width="1096" height="372" rx="14" fill="#101a17" stroke="#375647" stroke-width="1.5"/>
<rect x="52" y="31" width="1096" height="46" rx="14" fill="#1a2b24"/>
<path d="M52 65H1148V77H52Z" fill="#1a2b24"/>
<path d="M52 77H1148" stroke="#375647"/>
<circle cx="85" cy="54" r="6" fill="#e87e7e"/><circle cx="107" cy="54" r="6" fill="#ecc87b"/><circle cx="129" cy="54" r="6" fill="#84c39c"/>
<text x="600" y="58" class="mono muted" font-size="12" text-anchor="middle" letter-spacing="1">imsayon@fedora   ~   profile.sh</text>
<text x="1091" y="58" class="mono sage" font-size="10" text-anchor="end">● ONLINE</text>
<g class="mono" font-size="15">
  <text x="85" y="111" class="sage">❯</text><text x="108" y="111" class="body">whoami</text>
  <g class="appears one">
    <text x="85" y="168" font-family="system-ui,Segoe UI,sans-serif" font-weight="700" font-size="45" fill="url(#accent)">Sayon<tspan fill="#93b4a3">.</tspan></text>
    <text x="86" y="197" font-size="16" class="body">Backend engineering  /  distributed systems  /  infrastructure</text>
  </g>
  <g class="appears two"><text x="85" y="241" class="sage">❯</text><text x="108" y="241" class="body">cat ./currently</text></g>
  <g class="appears three"><text x="85" y="268" class="body">→ storage engines  ·  concurrency  ·  reliable backend software</text></g>
  <g class="appears four"><text x="85" y="291" class="body">→ building with C++ / TypeScript  ·  learning by shipping systems</text></g>
  <text x="85" y="347" class="sage">❯</text><text x="108" y="347" class="body">_</text>
  <rect class="cursor" x="128" y="330" width="10" height="20" fill="#92d6b3"/>
</g>
<path d="M52 370H1148" stroke="#375647"/>
<g class="mono muted" font-size="11"><text x="83" y="390">utf-8   ·   bash   ·   linux</text><text x="1110" y="390" text-anchor="end">github.com/imsayon  /  made to build</text></g>
</svg>