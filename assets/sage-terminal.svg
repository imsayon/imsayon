<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Sayon — systems engineer terminal introduction</title>
<desc id="desc">Animated terminal-style introduction in charcoal and sage. Contains genuine project interests and profile links.</desc>
<defs>
  <radialGradient id="back"><stop stop-color="#29322f"/><stop offset="1" stop-color="#101315"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#4b5550" stroke-width=".6" fill="none" opacity=".20"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A3D9A5"/><stop offset="1" stop-color="#EDE8DF"/></linearGradient>
  <pattern id="brushed" patternUnits="userSpaceOnUse" width="19" height="19"><path d="M0 1h19 M0 13h19" stroke="#EDE8DF" stroke-width=".32" opacity=".09"/><circle cx="8" cy="8" r=".42" fill="#EDE8DF" opacity=".11"/></pattern>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#343838"/><stop offset=".55" stop-color="#1D2224"/><stop offset="1" stop-color="#101315"/></linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#93a198}
  .body{fill:#EDE8DF}
  .sage{fill:#A3D9A5}
  .appears{animation:appear 12s both infinite}
  .one{animation-delay:0s}.two{animation-delay:.35s}.three{animation-delay:.75s}.four{animation-delay:1.15s}
  @keyframes appear{0%,4%{opacity:0;transform:translateY(5px)}12%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
  .cursor{animation:blink 1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.appears,.cursor{animation:none;opacity:1}}
</style>
<rect width="1200" height="440" fill="url(#back)"/>
<rect width="1200" height="440" fill="url(#grid)"/>
<rect x="52" y="31" width="1096" height="372" rx="14" fill="#171B1D" stroke="#655e53" stroke-width="1.5"/>
<rect x="56" y="35" width="1088" height="364" rx="12" fill="none" stroke="#9f917b" stroke-opacity=".30" stroke-width=".8"/>
<rect x="58" y="79" width="1084" height="286" rx="4" fill="url(#brushed)" opacity=".33" pointer-events="none"/>
<rect x="52" y="31" width="1096" height="46" rx="14" fill="url(#metal)"/>
