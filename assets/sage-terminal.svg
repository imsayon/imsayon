 <circle cx="64" cy="43" r="2.1"/><circle cx="1136" cy="43" r="2.1"/><circle cx="64" cy="390" r="2.1"/><circle cx="1136" cy="390" r="2.1"/>
</g>
<g class="mono" font-size="15">
  <text x="85" y="111" class="sage">❯</text><text x="108" y="111" class="body">whoami</text>
  <g class="appears one">
    <text x="85" y="168" font-family="system-ui,Segoe UI,sans-serif" font-weight="700" font-size="45" fill="url(#accent)">Sayon<tspan fill="#b9c1b5">.</tspan></text>
