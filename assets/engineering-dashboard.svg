          <text x="0" y="73" class="number">2</text>
          <text x="0" y="105" class="unit">days</text>
        </g><g transform="translate(862,112)">
          <text x="0" y="0" class="label">LONGEST STREAK</text>
          <text x="0" y="73" class="number">14</text>
          <text x="0" y="105" class="unit">days</text>
        </g>
<path d="M308 93V231 M582 93V231 M856 93V231" stroke="#2c4939" stroke-width="1.5"/>
<path d="M40 240H1120" stroke="#284535" stroke-width="1.2"/>
<text x="41" y="257" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#719481">SOURCE: GITHUB CONTRIBUTION CALENDAR</text>
<text x="1118" y="257" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#719481">SYNCED 15 Nov 2026 · UTC</text>
