<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Sayon GitHub activity</title>
<desc id="desc">GitHub contribution calendar: 1,327 in the last 365 days, 1,575 all time, 2 day current streak, 14 day longest streak.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25292B"/><stop offset="1" stop-color="#111416"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A3D9A5"/><stop offset="1" stop-color="#7BAF90"/></linearGradient>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:1.4px;fill:#B6BDAE}
 .value{font-family:system-ui,Segoe UI,Arial,sans-serif;font-weight:700;fill:#EDE8DF;font-variant-numeric:tabular-nums}
 .sub{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px;fill:#AEB8AC}
 .dot{animation:pulse 2.6s ease-in-out infinite}
 @keyframes pulse{50%{opacity:.4}}
 @media(prefers-reduced-motion:reduce){.dot{animation:none}}
 </style>
<pattern id="satin" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 3h18M0 14h18" stroke="#EDE8DF" opacity=".24" stroke-width=".3"/><circle cx="7" cy="9" r=".48" fill="#EDE8DF" opacity=".22"/></pattern>
</defs>
<rect width="560" height="360" rx="14" fill="url(#bg)"/>
<rect x="3" y="3" width="554" height="354" rx="12" fill="url(#satin)" opacity=".51" pointer-events="none"/>
<g fill="none" stroke="#8b7a66" opacity=".65" stroke-width=".85" pointer-events="none">
 <path d="M324 13h87l11 9h107"/><path d="M25 13h59"/><path d="M29 326h64m346 0h64"/>
 <path d="M469 322l5-6m7 6 5-6m7 6 5-6" stroke="#D1773C" stroke-width="1.5"/>
</g>
<g fill="#74736c" stroke="#d3c7b2" stroke-width=".45" opacity=".65" pointer-events="none">
 <circle cx="10" cy="10" r="2.2"/><circle cx="550" cy="10" r="2.2"/><circle cx="10" cy="350" r="2.2"/><circle cx="550" cy="350" r="2.2"/>
</g>
<rect x="1" y="1" width="558" height="358" rx="13" fill="none" stroke="#8A7562" stroke-width="1.5"/>
<text x="25" y="36" class="mono" font-size="13" font-weight="600" letter-spacing="1.3" fill="#B9DCBB">GITHUB / ACTIVITY</text>
<circle class="dot" cx="452" cy="31" r="4" fill="#A3D9A5"/>
<text x="463" y="35" class="mono" font-size="10" fill="#A8B7AA">VERIFIED</text>
<path d="M25 57H535" stroke="#505751" stroke-width="1.2"/>
<path d="M280 79V174" stroke="#505751" stroke-width="1.2"/>
<text x="25" y="94" class="label">LAST 365 DAYS</text>
<text x="25" y="145" class="value" font-size="43">1,327</text>
<text x="25" y="169" class="sub">contributions</text>
<text x="301" y="94" class="label">ALL TIME</text>
<text x="301" y="145" class="value" font-size="43">1,575</text>
<text x="301" y="169" class="sub">contributions</text>
<path d="M25 191H535" stroke="#505751" stroke-width="1.2"/>
<text x="25" y="217" class="label">CURRENT STREAK</text>
<circle cx="113" cy="278" r="42" fill="#181D1D" stroke="#475A4E" stroke-width="9"/>
<circle cx="113" cy="278" r="42" fill="none" stroke="url(#ring)" stroke-width="6"/>
<circle cx="113" cy="278" r="33.5" fill="none" stroke="#52675A" stroke-width="1" opacity=".7"/>
<path d="M113 227c-2 7-9 10-9 18a9 9 0 0 0 18 0c0-4-3-8-5-12-1 5-3 6-5 7 2-5 1-9 1-13z" fill="#A3D9A5" stroke="#171A1B" stroke-width="2"/>
<text x="113" y="288" class="value" font-size="31" text-anchor="middle">2</text>
<text x="178" y="274" class="sub">days</text>
<text x="300" y="217" class="label">LONGEST STREAK</text>
<text x="300" y="285" class="value" font-size="45">14</text>
<text x="380" y="285" class="sub">days</text>
<path d="M25 337H535" stroke="#505751" stroke-width="1.2"/>
<text x="25" y="350" class="mono" font-size="9" fill="#8F9D90">GITHUB CONTRIBUTION CALENDAR</text>
<text x="535" y="350" text-anchor="end" class="mono" font-size="9" fill="#8F9D90">22 Nov 2026 · UTC</text>
</svg>
