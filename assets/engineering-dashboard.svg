<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Sayon GitHub activity</title>
<desc id="desc">GitHub contribution calendar: 1,272 in the last 365 days, 1,500 all time, 2 day current streak, 14 day longest streak.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12231b"/><stop offset="1" stop-color="#0c1712"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8e8ca"/><stop offset="1" stop-color="#6bb68f"/></linearGradient>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:1.4px;fill:#92bda3}
 .value{font-family:system-ui,Segoe UI,Arial,sans-serif;font-weight:700;fill:#d8f3e2;font-variant-numeric:tabular-nums}
 .sub{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px;fill:#9eb9a8}
 .dot{animation:pulse 2.6s ease-in-out infinite}
 @keyframes pulse{50%{opacity:.4}}
 @media(prefers-reduced-motion:reduce){.dot{animation:none}}
 </style>
</defs>
<rect width="560" height="360" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="558" height="358" rx="13" fill="none" stroke="#37604a" stroke-width="1.5"/>
<text x="25" y="36" class="mono" font-size="13" font-weight="600" letter-spacing="1.3" fill="#b6dec3">GITHUB / ACTIVITY</text>
<circle class="dot" cx="452" cy="31" r="4" fill="#8ddaac"/>
<text x="463" y="35" class="mono" font-size="10" fill="#8eb89f">VERIFIED</text>
<path d="M25 57H535" stroke="#315140" stroke-width="1.2"/>
<path d="M280 79V174" stroke="#315140" stroke-width="1.2"/>
<text x="25" y="94" class="label">LAST 365 DAYS</text>
<text x="25" y="145" class="value" font-size="43">1,272</text>
<text x="25" y="169" class="sub">contributions</text>
<text x="301" y="94" class="label">ALL TIME</text>
<text x="301" y="145" class="value" font-size="43">1,500</text>
<text x="301" y="169" class="sub">contributions</text>
<path d="M25 191H535" stroke="#315140" stroke-width="1.2"/>
<text x="25" y="217" class="label">CURRENT STREAK</text>
<circle cx="113" cy="278" r="42" fill="#0f2117" stroke="#31533e" stroke-width="9"/>
<circle cx="113" cy="278" r="42" fill="none" stroke="url(#ring)" stroke-width="6"/>
<circle cx="113" cy="278" r="33.5" fill="none" stroke="#345640" stroke-width="1" opacity=".7"/>
<path d="M113 227c-2 7-9 10-9 18a9 9 0 0 0 18 0c0-4-3-8-5-12-1 5-3 6-5 7 2-5 1-9 1-13z" fill="#a6e0bd" stroke="#14221b" stroke-width="2"/>
<text x="113" y="288" class="value" font-size="31" text-anchor="middle">2</text>
<text x="178" y="274" class="sub">days</text>
<text x="300" y="217" class="label">LONGEST STREAK</text>
<text x="300" y="285" class="value" font-size="45">14</text>
<text x="380" y="285" class="sub">days</text>
<path d="M25 337H535" stroke="#315140" stroke-width="1.2"/>
<text x="25" y="350" class="mono" font-size="9" fill="#7b9d89">GITHUB CONTRIBUTION CALENDAR</text>
<text x="535" y="350" text-anchor="end" class="mono" font-size="9" fill="#7b9d89">15 Nov 2026 · UTC</text>
</svg>
