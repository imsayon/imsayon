<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 270" role="img" aria-labelledby="title desc">
  <title id="title">Sayon GitHub engineering activity — awaiting first verified sync</title>
  <desc id="desc">Statistics will appear after the owner configures PROFILE_STATS_TOKEN and runs the profile stats workflow. No invented counts are shown.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13221c"/><stop offset="1" stop-color="#0b1310"/></linearGradient></defs>
  <rect width="1160" height="270" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="268" rx="15" fill="none" stroke="#345843" stroke-width="1.5"/>
  <path d="M40 63H1120" stroke="#284535" stroke-width="1.3"/>
  <text x="40" y="37" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="600" letter-spacing="1.8" fill="#b6dfc5">GITHUB / ENGINEERING ACTIVITY</text>
  <circle cx="925" cy="33" r="4.5" fill="#b6aa76"/>
  <text x="941" y="37" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#b6aa76">SYNC PENDING</text>
  <text x="40" y="137" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#daf1df">Waiting for verified GitHub data</text>
  <text x="40" y="178" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" fill="#9fb4a6">Configure PROFILE_STATS_TOKEN in Actions secrets, then run the workflow.</text>
  <path d="M40 240H1120" stroke="#284535" stroke-width="1.2"/>
  <text x="40" y="257" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#719481">NO COUNTS SHOWN BEFORE API VERIFICATION</text>
</svg>
