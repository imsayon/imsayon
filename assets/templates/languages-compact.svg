<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Languages used by file size</title>
<desc id="desc">GitHub Linguist byte counts across {{REPO_COUNT}} public, owned, non-fork repositories. Bars show proportions by file size, not proficiency.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12231b"/><stop offset="1" stop-color="#0c1712"/></linearGradient>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .name{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13.5px;font-weight:500;fill:#d5e7db}
 .pct{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#bbd2c2}
 </style>
</defs>
<rect width="560" height="360" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="558" height="358" rx="13" fill="none" stroke="#37604a" stroke-width="1.5"/>
<text x="25" y="36" class="mono" font-size="13" font-weight="600" letter-spacing="1.2" fill="#b6dec3">LANGUAGES / BY FILE SIZE</text>
<text x="535" y="35" text-anchor="end" class="mono" font-size="10" fill="#8eb89f">{{REPO_COUNT}} PUBLIC REPOS</text>
<path d="M25 57H535" stroke="#315140" stroke-width="1.2"/>
{{ROWS}}
<path d="M25 337H535" stroke="#315140" stroke-width="1.2"/>
<text x="25" y="350" class="mono" font-size="9" fill="#7b9d89">GITHUB LINGUIST · PUBLIC REPOS</text>
<text x="535" y="350" text-anchor="end" class="mono" font-size="9" fill="#7b9d89">{{SYNCED}}</text>
</svg>
