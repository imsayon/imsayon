<g><title>CSS: 8.7%</title><text x="25" y="216" class="name">CSS</text><rect x="143" y="205" width="305.0" height="12" rx="6" fill="#353B39"/><rect x="143" y="205" width="26.65" height="12" rx="6.00" fill="#5a88e5"/><text x="535" y="216" text-anchor="end" class="pct">8.7%</text></g>
