<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Languages used by file size</title>
<desc id="desc">GitHub Linguist byte counts across 14 public, owned, non-fork repositories. Bars show proportions by file size, not proficiency.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12231b"/><stop offset="1" stop-color="#0c1712"/></linearGradient>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .name{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13.5px;font-weight:500;fill:#d5e7db}
 .pct{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#bbd2c2}
 </style>
</defs>
<rect width="560" height="360" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="558" height="358" rx="13" fill="none" stroke="#37604a" stroke-width="1.5"/>
<text x="25" y="36" class="mono" font-size="13" font-weight="600" letter-spacing="1.2" fill="#b6dec3">LANGUAGES / BY FILE SIZE</text>
<text x="535" y="35" text-anchor="end" class="mono" font-size="10" fill="#8eb89f">14 PUBLIC REPOS</text>
<path d="M25 57H535" stroke="#315140" stroke-width="1.2"/>
<g><title>TypeScript: 44.2%</title><text x="25" y="96" class="name">TypeScript</text><rect x="143" y="85" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="85" width="134.75" height="12" rx="6.00" fill="#3178c6"/><text x="535" y="96" text-anchor="end" class="pct">44.2%</text></g>
<g><title>JavaScript: 13.9%</title><text x="25" y="126" class="name">JavaScript</text><rect x="143" y="115" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="115" width="42.27" height="12" rx="6.00" fill="#f7df1e"/><text x="535" y="126" text-anchor="end" class="pct">13.9%</text></g>
<g><title>C++: 11.1%</title><text x="25" y="156" class="name">C++</text><rect x="143" y="145" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="145" width="33.87" height="12" rx="6.00" fill="#72b3e1"/><text x="535" y="156" text-anchor="end" class="pct">11.1%</text></g>
<g><title>HTML: 10.2%</title><text x="25" y="186" class="name">HTML</text><rect x="143" y="175" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="175" width="31.00" height="12" rx="6.00" fill="#e67c55"/><text x="535" y="186" text-anchor="end" class="pct">10.2%</text></g>
<g><title>Python: 9.0%</title><text x="25" y="216" class="name">Python</text><rect x="143" y="205" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="205" width="27.46" height="12" rx="6.00" fill="#ffcb61"/><text x="535" y="216" text-anchor="end" class="pct">9.0%</text></g>
<g><title>CSS: 7.5%</title><text x="25" y="246" class="name">CSS</text><rect x="143" y="235" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="235" width="22.73" height="12" rx="6.00" fill="#5a88e5"/><text x="535" y="246" text-anchor="end" class="pct">7.5%</text></g>
<g><title>Java: 2.6%</title><text x="25" y="276" class="name">Java</text><rect x="143" y="265" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="265" width="7.78" height="12" rx="3.89" fill="#d3a475"/><text x="535" y="276" text-anchor="end" class="pct">2.6%</text></g>
<g><title>Other: 1.7%</title><text x="25" y="306" class="name">Other</text><rect x="143" y="295" width="305.0" height="12" rx="6" fill="#29342e"/><rect x="143" y="295" width="5.13" height="12" rx="2.57" fill="#697c75"/><text x="535" y="306" text-anchor="end" class="pct">1.7%</text></g>
<path d="M25 337H535" stroke="#315140" stroke-width="1.2"/>
<text x="25" y="350" class="mono" font-size="9" fill="#7b9d89">GITHUB LINGUIST · PUBLIC REPOS</text>
<text x="535" y="350" text-anchor="end" class="mono" font-size="9" fill="#7b9d89">15 Nov 2026 UTC</text>
</svg>
