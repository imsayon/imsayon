<g><title>C++: 10.0%</title><text x="25" y="156" class="name">C++</text><rect x="143" y="145" width="305.0" height="12" rx="6" fill="#353B39"/><rect x="143" y="145" width="30.59" height="12" rx="6.00" fill="#72b3e1"/><text x="535" y="156" text-anchor="end" class="pct">10.0%</text></g>
