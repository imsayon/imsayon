<path d="M25 337H535" stroke="#505751" stroke-width="1.2"/>
<text x="25" y="350" class="mono" font-size="9" fill="#8F9D90">GITHUB LINGUIST · PUBLIC REPOS</text>
<text x="535" y="350" text-anchor="end" class="mono" font-size="9" fill="#8F9D90">28 Nov 2026 UTC</text>
