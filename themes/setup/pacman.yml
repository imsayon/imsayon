name: Generate Pac-Man

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pacman.yml

permissions:
  contents: write

concurrency:
  group: profile-pacman
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: imsayon
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
